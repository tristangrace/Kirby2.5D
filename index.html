<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1424" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Kirby 2.5D</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #1a1424; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #fullscreen {
        position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
        width: 40px; height: 40px; border: 2px solid #fff; border-radius: 8px;
        background: rgba(26, 20, 36, 0.6); color: #fff; font-size: 20px; line-height: 36px; text-align: center;
        cursor: pointer; padding: 0; font-family: ui-monospace, monospace; z-index: 5;
      }
      #fullscreen:hover { background: rgba(255, 176, 207, 0.6); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui" class="kb-layer"></div>
    <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
